<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="frets.js" defer></script>
    <link rel="stylesheet" href="styles.css" type="text/css" />
    <title>Fret Slot G Code Generator</title>
    
Favicon fc · SVG
Copy

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(140,93%,16%);stop-opacity:1" />
      <stop offset="100%" style="stop-color:hsl(150,85%,10%);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  
  <!-- F letter - left side -->
  <rect x="10" y="14" width="4" height="36" rx="1.5" fill="hsl(140,93%,72%)"/>
  <rect x="10" y="14" width="18" height="4" rx="1.5" fill="hsl(140,93%,72%)"/>
  <rect x="10" y="29" width="14" height="3.5" rx="1.5" fill="hsl(140,93%,72%)"/>
  
  <!-- C letter - right side -->
  <path d="M 54 21 
             A 13 13 0 1 0 54 43" 
        fill="none" 
        stroke="hsl(140,93%,72%)" 
        stroke-width="4" 
        stroke-linecap="round"
        transform="translate(-4, 0)"/>
</svg>
</head>
<body>
    <h1>Fret Slot G Code Generator for CNC</h1>
    <div class="container">
        <div class="form-body">
            <form name="gCode-Form" class="g-code-form">
                <div><p>Unit</p>
                    <label for="inch">Inch</label>
                    <input type="radio" name="unit" id="inch" value="in" />
                    <label for="mm">Millimeters</label>
                    <input type="radio" id="mm" name="unit" value="mm" />
                    </input>
                </div>
                <label for="scale">Scale</label>
                <input name="scale" id="scale" type="text" required="true"/>
                <label for="numFrets">Number of frets</label>
                <input name="num_frets" id="numFrets" type="text" required="true"/>
                <label for="slotDepth">Depth of slot (Z Axis)</label>
                <input name="slot_depth" id="slotDepth" />
                <label for="stepDown">Maximum step down</label>
                <input name="step_down" id="stepDown" type="text" />
                <label for="cutSpeed">Cutting Speed</label>
                <input name="cut_speed" id="cutSpeed" type="text" />
                <label for="bit_diameter">Bit Diameter (.5mm recommended for frets with a cut speed around 500mm/min)</label>
                <input name="bit_diameter" id="bitDiameter" type="text" />
                <label for="last_fret_width">Fretboard width at last fret</label>
                <input name="lastFretWidth" id="lastFretWidth" />
                <label for="nutWidth">Fretboard width at Nut</label>
                <input name="nut_width" id="nutWidth" />
                <input type="button" value="Create G Code" onclick="fretsTest()" />
            </form>
            
        </div>
        <div class="code-space">
        <div class="g-code-window" id="gCodeWin"></div>
        <div class="copy-button" onclick="copyDivToClipboard()">Copy</div>
        </div>
    </div>
    <div class="donate">If you find this tool useful consider <a href="https://buymeacoffee.com/shaynerushton">donating</a></div>
    
</body>
</html>
