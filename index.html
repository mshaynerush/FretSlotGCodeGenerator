<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="frets.js" defer></script>
    <link rel="stylesheet" href="styles.css" type="text/css" />
    <title>Fret Slot G Code Generator</title>
    <link rel="shortcut icon" type="image/svg+xml" href="img/favicon.svg">

</head>
<body>
   <div class="container">
        <form>
            <div class="radio-group full-width">
                <label>Unit</label>
                <div class="radio-options">
                    <div>
                        <input type="radio" id="mm" name="unit" value="mm" checked>
                        <label for="mm">mm</label>
                    </div>
                    <div>
                        <input type="radio" id="in" name="unit" value="inch">
                        <label for="in">inch</label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="scale">Scale Length</label>
                <input type="text" id="scale" name="scale">
            </div>
            <div class="form-group">
                <label for="numFrets">Number of Frets</label>
                <input type="text" id="numFrets" name="num_frets">
            </div>
            <div class="form-group">
                <label for="slotDepth">Depth of Slot</label>
                <input type="text" id="slotDepth" name="slot_depth">
            </div>
            <div class="form-group">
                <label for="stepDown">Maximum Stepdown</label>
                <input type="text" id="stepDown" name="step_down">
            </div>
            <div class="form-group">
                <label for="cutSpeed">Cutting Speed</label>
                <input type="text" id="cutSpeed" name="cut_speed">
            </div>
            <div class="form-group">
                <label for="bitDiameter">Bit Diameter</label>
                <input type="text" id="bitDiameter" name="bit_diameter">
            </div>
            <div class="form-group">
                <label for="lastFretWidth">Fretboard width at last fret</label>
                <input type="text" id="lastFretWidth" name="last_fret_width">
            </div>
            <div class="form-group">
                <label for="nutWidth">Fretboard width at nut</label>
                <input type="text" id="nutWidth" name="nut_width">
            </div>
            <div class="form-group full-width">
                 <button type="button" onclick="fretsTest()">Generate G Code</button>
            </div>
        </form>
        <div class="g-code-window" id="gCodeWin">
            <!-- G Code will be displayed here -->
            This is where the generated G-Code will appear.
            It will scroll if the content is too long.
        </div>
    </div>
    <div class="button-container">
        <button onclick="copyDivToClipboard()">Copy</button>
    </div>
</body>
</html>
